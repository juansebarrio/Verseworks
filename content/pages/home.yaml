supportLine: Poetry, made live.
description: >-
  Verseworks is a multilingual poetry studio creating participatory
  experiences, performances, installations and commissions for festivals,
  cultural institutions, public spaces, hospitality and brands.
poetryHappeningIntro: >-
  Verseworks creates situations in which people encounter poetry by making it,
  speaking it, hearing it or becoming part of it.
poemMightLines:
  - A poem might begin with a conversation between two people.
  - It might emerge collectively across a festival.
  - 'It might be performed, projected onto a building,'
  - 'written across a wall,'
  - whispered into headphones or carried home in someone's pocket.
aPoemBelongsHere:
  first: >-
    Every project begins with its setting. We do not place the same format
    into every room. We consider who will be there, how they will encounter
    the work and what form the poetry should take.
  second: >-
    From one poet at an intimate gathering to a multilingual programme across
    an entire festival, Verseworks can shape the concept, select the artists
    and support the experience from beginning to end.
